name: geo_app
description: Automatic geofenced attendance that stays correct after the app has been closed for days.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  native_geofence: ^1.3.1
  workmanager: ^0.10.10
  geolocator: ^14.1.1
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  http: ^1.5.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5
  android_intent_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
